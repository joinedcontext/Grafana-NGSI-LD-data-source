# Helsinki demo: Antares NGSI-LD broker with live open data of Helsinki (FMI air quality, HSL trams,
# Linked Events) and OpenStreetMap places, Grafana with the NGSI-LD data source from its GitHub
# release. The feeds need internet.
#   docker compose up -d      then http://localhost:3000
# Ports bind to 127.0.0.1: Grafana logs everyone in as admin and Antares authenticates nobody.
name: ngsild-helsinki
services:
  antares:
    image: ghcr.io/joinedcontext/antares-broker:${ANTARES_VERSION:-0.1.4}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BROKER_PORT:-9090}:9090"

  # buildings, roads, parks and squares (OpenStreetMap shapes); `docker compose run --rm seed` rewrites them
  seed:
    image: node:22-alpine
    depends_on:
      antares:
        condition: service_healthy
    volumes:
      - ../../datasource/seed:/seed:ro
    command: ["node", "/seed/seed.mjs", "--broker", "http://antares:9090", "--places-only"]
    restart: "no"

  # measured air quality of 8 stations (Finnish Meteorological Institute): 48 h history, then hourly
  air:
    build: ./feeds
    image: ngsild-helsinki-feeds
    command: ["node", "fmi.mjs"]
    depends_on:
      antares:
        condition: service_healthy
    environment:
      - BROKER_URL=http://antares:9090
    restart: unless-stopped

  # live trams from HSL's public MQTT feed; each write sets expiresAt 8 minutes ahead
  hsl:
    build: ./feeds
    image: ngsild-helsinki-feeds
    command: ["node", "hsl.mjs"]
    depends_on:
      antares:
        condition: service_healthy
    environment:
      - BROKER_URL=http://antares:9090
      - VEHICLES=${HSL_VEHICLES:-8}
      - EXPIRES_MINUTES=${HSL_EXPIRES_MINUTES:-8}
    restart: unless-stopped

  # the next 24 h of events in central Helsinki (Linked Events); each expires when it ends
  events:
    build: ./feeds
    image: ngsild-helsinki-feeds
    command: ["node", "events.mjs"]
    depends_on:
      antares:
        condition: service_healthy
    environment:
      - BROKER_URL=http://antares:9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.3.0}
    # Grafana stops when the plugin download fails (no internet yet); it tries again
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # the plugin release this dashboard is made for, installed before Grafana starts (CI checks that it
      # matches the plugin version); NGSILD_PLUGIN_URL picks another zip, e.g. .../releases/latest/download/...
      # docker-compose.dev.yml uses the local build instead
      - GF_PLUGINS_PREINSTALL_SYNC=ngsild-grafana-datasource@@${NGSILD_PLUGIN_URL:-https://github.com/joinedcontext/Grafana-NGSI-LD-data-source/releases/download/v8.1.1/ngsild-grafana-datasource.zip}
      # the release zip is unsigned
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=ngsild-grafana-datasource
      # demo only: anonymous admin, never expose this stack
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/helsinki-live.json
