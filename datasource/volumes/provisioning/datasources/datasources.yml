apiVersion: 1

# https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
# Values come from the environment of the grafana service (docker-compose.yml).
datasources:
  - name: NGSI-LD
    uid: ngsild_1
    type: ngsild-grafana-datasource
    access: proxy
    url: $BROKER_URL
    isDefault: true
    editable: true
    jsonData:
      contextUrl: $CONTEXT_URL
      tenant: $TENANT
      authType: $AUTH_TYPE
      tokenUrl: $TOKEN_URL
    secureJsonData:
      clientId: $CLIENT_ID
      clientSecret: $CLIENT_SECRET
