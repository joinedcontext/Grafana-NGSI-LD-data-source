# Gateway in front of Antares, the part a production deployment's gateway plays (Antares itself
# authenticates nobody). Three listeners, one per credential the plugin can send:
#   10000  OAuth2 bearer token from Keycloak: signature (JWKS), issuer and expiry checked; authorization:
#          realm role ngsi-ld-reader and read-only methods, everything else 403
#   10001  basic auth, user grafana; GET and HEAD only
#   10002  API key in X-API-Key; GET and HEAD only
# Read-only on every listener: Grafana's data source proxy forwards any method with the stored
# credentials, so the gateway, not the plugin, keeps Grafana users from writing.
# @ISSUER@ is replaced at start (docker-compose.auth.yml): the token issuer is Keycloak's public URL.
static_resources:
  listeners:
    - name: oauth
      address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: oauth
                route_config:
                  virtual_hosts:
                    - name: broker
                      domains: ["*"]
                      routes: [{ match: { prefix: "/" }, route: { cluster: antares, timeout: 60s } }]
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          issuer: "@ISSUER@"
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak:8080/realms/ngsild/protocol/openid-connect/certs
                              cluster: keycloak
                              timeout: 5s
                            cache_duration: 300s
                            async_fetch: {}
                          payload_in_metadata: jwt_payload
                      rules:
                        - match: { prefix: "/" }
                          requires: { provider_name: keycloak }
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          ngsi-ld-reader:
                            permissions:
                              - or_rules:
                                  rules:
                                    - header: { name: ":method", string_match: { exact: GET } }
                                    - header: { name: ":method", string_match: { exact: HEAD } }
                            principals:
                              - metadata:
                                  filter: envoy.filters.http.jwt_authn
                                  path: [{ key: jwt_payload }, { key: realm_access }, { key: roles }]
                                  value: { list_match: { one_of: { string_match: { exact: ngsi-ld-reader } } } }
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }

    - name: basic
      address: { socket_address: { address: 0.0.0.0, port_value: 10001 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: basic
                route_config:
                  virtual_hosts:
                    - name: broker
                      domains: ["*"]
                      routes: [{ match: { prefix: "/" }, route: { cluster: antares, timeout: 60s } }]
                http_filters:
                  - name: envoy.filters.http.basic_auth
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.basic_auth.v3.BasicAuth
                      # htpasswd SHA form of grafana-basic-pw
                      users: { inline_string: "grafana:{SHA}GWseC61G9YkpQMm6qD0wOpvHMIE=" }
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          read-only:
                            permissions:
                              - or_rules:
                                  rules:
                                    - header: { name: ":method", string_match: { exact: GET } }
                                    - header: { name: ":method", string_match: { exact: HEAD } }
                            principals: [{ any: true }]
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }

    - name: apikey
      address: { socket_address: { address: 0.0.0.0, port_value: 10002 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: apikey
                route_config:
                  virtual_hosts:
                    - name: broker
                      domains: ["*"]
                      routes: [{ match: { prefix: "/" }, route: { cluster: antares, timeout: 60s } }]
                http_filters:
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          api-key:
                            permissions:
                              - or_rules:
                                  rules:
                                    - header: { name: ":method", string_match: { exact: GET } }
                                    - header: { name: ":method", string_match: { exact: HEAD } }
                            principals:
                              - header: { name: x-api-key, string_match: { exact: demo-api-key-0123456789abcdef } }
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }

  clusters:
    - name: antares
      type: STRICT_DNS
      load_assignment:
        cluster_name: antares
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: antares, port_value: 9090 } } } }] }]
    - name: keycloak
      type: STRICT_DNS
      load_assignment:
        cluster_name: keycloak
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: keycloak, port_value: 8080 } } } }] }]
