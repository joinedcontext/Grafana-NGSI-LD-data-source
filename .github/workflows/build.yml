name: CI

# Pull requests and pushes: checks, integration and end-to-end tests.
# Release: a push to main whose datasource/plugin/package.json version has no v<version> tag yet (a version
# bump), a pushed v* tag, or a manual run with release_tag builds the plugin zip, signs it when
# GRAFANA_ACCESS_POLICY_TOKEN is set, and publishes a GitHub release with the zip and its SHA-256:
#   https://github.com/<owner>/<repo>/releases/download/v<version>/ngsild-grafana-datasource.zip
#   https://github.com/<owner>/<repo>/releases/latest/download/ngsild-grafana-datasource.zip
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build and attach the zip to (empty: checks only)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cut a release short

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datasource/plugin
    services:
      postgres:
        image: ghcr.io/baosystems/postgis:17-3.5
        env:
          POSTGRES_USER: antares
          POSTGRES_PASSWORD: antares
          POSTGRES_DB: antares
        options: >-
          --health-cmd "pg_isready -U antares -d antares"
          --health-interval 5s --health-timeout 3s --health-retries 30
      # the integration tests seed their own tenant into it; it waits for the database on its own
      antares:
        image: ghcr.io/joinedcontext/antares-broker:0.2.0
        env:
          ANTARES_STORE: postgres
          ANTARES_DATABASE_URL: postgres://antares:antares@postgres:5432/antares
          ANTARES_ALLOW_SHARED_LOCAL: "1"
        ports:
          - 9090:9090
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: datasource/plugin/.nvmrc
          cache: npm
          cache-dependency-path: datasource/plugin/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci

      - name: Integration tests against Antares
        env:
          NGSILD_BROKER_URL: http://localhost:9090
        run: |
          for _ in $(seq 1 30); do curl -sf "$NGSILD_BROKER_URL/ngsi-ld/v1/types" >/dev/null && break; sleep 2; done
          npm run test:integration

      - run: npm run build

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: datasource/plugin/.nvmrc

      - name: Demo feed tests
        working-directory: demos/helsinki/feeds
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Helsinki demo pins the plugin version
        run: |
          version=$(jq -r .version datasource/plugin/package.json)
          grep -q "releases/download/v$version/ngsild-grafana-datasource.zip" demos/helsinki/docker-compose.yml \
            || { echo "::error::demos/helsinki/docker-compose.yml must install v$version"; exit 1; }

      - name: Compose files
        run: |
          docker compose -f datasource/docker-compose.yml config --quiet
          docker compose -f datasource/docker-compose.yml -f datasource/docker-compose.auth.yml config --quiet
          docker compose -f demos/helsinki/docker-compose.yml config --quiet
          docker compose -f demos/helsinki/docker-compose.yml -f demos/helsinki/docker-compose.dev.yml config --quiet

  e2e:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grafana: ['12.3.0', '13.2.4']
    env:
      GRAFANA_VERSION: ${{ matrix.grafana }}
      GRAFANA_URL: http://localhost:3000
      NGSILD_AUTH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: datasource/plugin/.nvmrc
          cache: npm
          cache-dependency-path: datasource/plugin/package-lock.json

      - name: Start the test stack with the auth gateway
        working-directory: datasource
        run: |
          docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d --build
          for _ in $(seq 1 90); do
            curl -sf "$GRAFANA_URL/api/health" >/dev/null && curl -sf http://localhost:8080/realms/ngsild >/dev/null && break
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.auth.yml ps

      - name: End-to-end tests
        working-directory: datasource/plugin
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Stack logs
        if: failure()
        working-directory: datasource
        run: docker compose -f docker-compose.yml -f docker-compose.auth.yml logs --no-color --tail 200

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.grafana }}
          path: datasource/plugin/playwright-report
          retention-days: 7

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Release tag
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(node -p "require('./datasource/plugin/package.json').version")
          release=false
          if [ -n "$RELEASE_TAG" ]; then
            tag=$RELEASE_TAG; release=true
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            tag=${GITHUB_REF#refs/tags/}; release=true
          else
            tag=v$version
            # a version bump on main: no tag for this version yet
            if [ "$EVENT" = push ] && [[ $GITHUB_REF =~ ^refs/heads/(main|master)$ ]] &&
              ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              release=true
            fi
          fi
          if [ "$release" = true ] && [ "${tag#v}" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag $tag, release $release"

  release:
    needs: [version, test, demo, e2e]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    defaults:
      run:
        working-directory: datasource/plugin
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: datasource/plugin/.nvmrc
          cache: npm
          cache-dependency-path: datasource/plugin/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Version and date
        run: sed -i "s/%VERSION%/${TAG#v}/g; s/%TODAY%/$(date -u +%Y-%m-%d)/g" dist/plugin.json

      - name: Sign
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        if: env.GRAFANA_ACCESS_POLICY_TOKEN != ''
        run: npm run sign

      - name: Pack
        run: |
          cp -r dist ngsild-grafana-datasource
          zip -qr ngsild-grafana-datasource.zip ngsild-grafana-datasource
          sha256sum ngsild-grafana-datasource.zip > ngsild-grafana-datasource.zip.sha256

      # creates the tag at this commit when it does not exist yet (a version bump on main)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          files: |
            datasource/plugin/ngsild-grafana-datasource.zip
            datasource/plugin/ngsild-grafana-datasource.zip.sha256
          generate_release_notes: true

  # the demo as a user starts it, with the plugin from the release just published
  release-demo:
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false

      - name: Start the Helsinki demo with the released plugin
        working-directory: demos/helsinki
        run: |
          export NGSILD_PLUGIN_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/ngsild-grafana-datasource.zip"
          docker compose up -d
          for _ in $(seq 1 60); do curl -sf http://localhost:3000/api/health >/dev/null && break; sleep 3; done
          version=$(curl -sf http://localhost:3000/api/plugins/ngsild-grafana-datasource/settings | jq -r .info.version)
          echo "Grafana runs plugin $version"
          test "$version" = "${TAG#v}"
          # the seeded places; the live feeds depend on outside services
          curl -sf "http://localhost:9090/ngsi-ld/v1/entities?type=Park&pick=id" | jq -e 'length == 2'

      - name: Demo logs
        if: failure()
        working-directory: demos/helsinki
        run: docker compose logs --no-color --tail 200
